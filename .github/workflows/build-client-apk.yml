name: build client APK (extras)

on:
  workflow_dispatch:
  push:
    tags:
      - 'continuous'

permissions:
  contents: write

env:
  CS16_CLIENT_URL: https://github.com/Yoriva/bridge.git

jobs:
  build-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Detect build type
        id: type
        shell: bash
        run: |
          MSG=$(git log -1 --pretty=%s)
          echo "Commit message: $MSG"
          LOWER=$(echo "$MSG" | tr '[:upper:]' '[:lower:]')
          NEEDS_CLIENT=false
          if echo "$LOWER" | grep -q '\[client\]'; then NEEDS_CLIENT=true; fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then NEEDS_CLIENT=true; fi
          echo "needs_client=$NEEDS_CLIENT" >> "$GITHUB_OUTPUT"
          echo "Client build: $NEEDS_CLIENT"
          if [ "$NEEDS_CLIENT" != "true" ]; then
            echo "::notice::no [client] marker in the commit message - skipping client build"
          fi

      - name: Fetch cs16-client
        if: steps.type.outputs.needs_client == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PIN=$(tr -d '[:space:]' < cs16-client.pin)
          [ -n "$PIN" ] || { echo "::error::cs16-client.pin is empty"; exit 1; }
          git clone "$CS16_CLIENT_URL" cs16-client
          git -C cs16-client fetch origin "$PIN" 2>/dev/null || git -C cs16-client fetch origin
          git -C cs16-client checkout "$PIN"
          git -C cs16-client submodule update --init --recursive
          GOT=$(git -C cs16-client rev-parse HEAD)
          [ "$GOT" = "$PIN" ] || { echo "::error::cs16-client is $GOT, pin says $PIN"; exit 1; }
          echo "cs16-client -> $GOT"

      - name: Set up JDK 17
        if: steps.type.outputs.needs_client == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK
        if: steps.type.outputs.needs_client == 'true'
        shell: bash
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          [ -n "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          CLIENT_NDK=$(grep -oP 'ndkVersion\s*=\s*"\K[^"]+' cs16-client/android/app/build.gradle)
          if [ ! -d "$ANDROID_HOME/ndk/$CLIENT_NDK" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            echo "y" | "$SDKMANAGER" "ndk;$CLIENT_NDK" || true
          fi

      - name: Bundle debug signing keystore
        if: steps.type.outputs.needs_client == 'true'
        shell: bash
        run: |
          mkdir -p cs16-client/android/app/src/main/assets/keystore 2>/dev/null || true

      - name: Apply launcher patch
        if: steps.type.outputs.needs_client == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -s "$GITHUB_WORKSPACE/cs16-client-launcher.patch" ]; then
            git -C cs16-client apply --check "$GITHUB_WORKSPACE/cs16-client-launcher.patch"
            git -C cs16-client apply "$GITHUB_WORKSPACE/cs16-client-launcher.patch"
          fi

      - name: Build the unsigned bridge APK
        if: steps.type.outputs.needs_client == 'true'
        working-directory: cs16-client/android
        run: |
          ./gradlew --no-daemon assembleGitContinuous --stacktrace
          cp app/build/outputs/apk/git/continuous/app-git-continuous-unsigned.apk \
             "$GITHUB_WORKSPACE/CS16Client-Android.apk"
          ls -lh "$GITHUB_WORKSPACE/CS16Client-Android.apk"

      - name: Upload to extras release
        if: steps.type.outputs.needs_client == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view extras >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f extras
            git push origin extras
            gh release create extras --title "Yoriva Extras" --notes "Addons, game assets and client APK (rolling)."
          fi
          gh release upload extras --clobber "$GITHUB_WORKSPACE/CS16Client-Android.apk"
          echo "uploaded CS16Client-Android.apk to extras"
